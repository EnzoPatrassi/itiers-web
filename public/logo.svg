<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 90" width="400" height="90" fill="none">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Emblem Icon: Connected Data Nodes -->
  <g transform="translate(10, 15)">
    <rect x="0" y="0" width="60" height="60" rx="14" fill="url(#blueGradient)" />
    <!-- Network Graph Nodes & Lines -->
    <path d="M18 42L30 20L42 34L30 42Z" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.8" />
    <circle cx="18" cy="42" r="4.5" fill="#FFFFFF" />
    <circle cx="30" cy="20" r="4.5" fill="#60A5FA" />
    <circle cx="42" cy="34" r="4.5" fill="#FFFFFF" />
    <circle cx="30" cy="42" r="3.5" fill="#93C5FD" />
  </g>

  <!-- Typography: ITIERS DATA SENSE -->
  <text x="85" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" letter-spacing="-0.5" fill="#0F172A">
    ITIERS
  </text>
  <text x="85" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" letter-spacing="3" fill="#2563EB">
    DATA SENSE
  </text>
</svg>
